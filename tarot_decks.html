    <script>
      // Mapear cada data-deck a su carpeta real
      const deckFolderMap = {
        deck1: "tarot_surrealista",
        deck2: "tarot_caravaggio",
        deck3: "tarot_dada",
        deck4: "tarot_munch",
      };

      document.querySelectorAll(".deck-card").forEach(card => {
        card.addEventListener("click", () => {
          const deckKey = card.getAttribute("data-deck");
          const folder = deckFolderMap[deckKey];
          if (folder) {
            window.location.href = `tarot.html?deck=${folder}`;
          }
        });
      });
    </script>
