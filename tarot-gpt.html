<!DOCTYPE html>
<html lang="de">

<head>


  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preload" as="image" href="tarot2/reverso.jpg">

  <title>Wilmer Florez - Web Developer</title>
  <link rel="preload" as="image" href="tarot2/reverso.jpg" fetchpriority="high">
  <link rel="stylesheet" href="styles/style-tarot.css">

  <link rel="stylesheet" href="styles/cards_intro.css">
  <link rel="stylesheet" href="styles/header_test.css">
  <link rel="stylesheet" href="styles/cards.css">
  <link rel="stylesheet" href="styles/images.css">
  <link rel="stylesheet" href="styles/global-text.css">

  <link rel="stylesheet" href="styles/languages_content.css">
  <script src="scripts/languages_content.js" defer></script>


</head>

<body>
  <div class="container">
    <div class="header">
      <div class="nav-container">
        <a href="index.html">
          <img src="imagenes/Logo.png" alt="Kopernikus Design Logo" class="header-logo">
        </a>
      </div>
    </div>

    <div class="hamburger-menu">
      <div class="hamburger" id="hamburger">
        <span></span><span></span><span></span>
      </div>
    </div>

    <div class="language-selector">
      <input type="checkbox" id="langToggle" hidden />
      <label for="langToggle" class="current-lang">DE ▼</label>
      <ul class="language-options">
        <li><button class="lang-button" data-lang="de">DE</button></li>
        <li><button class="lang-button" data-lang="en">EN</button></li>
        <!-- para agregar más idiomas en el futuro -->
        <!--<li><button class="lang-button" data-lang="es">ES</button></li>-->
      </ul>
    </div>

    <div class="menu-overlay" id="menuOverlay">
      <ul>
        <li>
          <a href="index.html">
            <img class="menu-icon" src="imagenes/svg/cubo.svg" alt="Startseite Icon">
            <span data-i18n="menuIndex">Startseite</span>
          </a>
        </li>

        <li>
          <a href="projekte.html">
            <img class="menu-icon" src="imagenes/svg/cases.svg" alt="Projekte Icon">
            <span data-i18n="menuProjekte">Projekte</span>
          </a>
        </li>

        <li>
          <a href="docs/Lebenslauf.pdf" target="_blank">
            <img class="menu-icon" src="imagenes/svg/lebenslauf.svg" alt="Lebenslauf Icon">
            <span data-i18n="menuCV">Lebenslauf</span>
          </a>
        </li>


        <li>
          <a href="kontakt.html">
            <img class="menu-icon" src="imagenes/svg/contact.svg" alt="Kontakt Icon">
            <span data-i18n="menuKontakt">Kontakt</span>
          </a>
        </li>
      </ul>
    </div>

       <h2 class="title" data-i18n="tarotTitle">INTERAKTIVES TAROT</h2>
    <button class="tarot-button" id="una-carta" data-i18n="eineKarte">Ziehe eine Karte</button>
    <button class="tarot-button" id="triada" data-i18n="eineTriade">Ziehe eine Triade</button>

    <div id="resultado"></div>

    <div id="tarot-oraculo">
      <h3>Pregunta al oráculo</h3>
      <p class="oraculo-texto">
        Formula una pregunta y después de hacer tu tirada, consulta al oráculo.
      </p>
      <textarea id="tarot-question" rows="3" 
        placeholder="Escribe aquí tu pregunta al oráculo..."></textarea>
      <button class="tarot-button" id="ask-oracle-btn">
        Preguntar al oráculo
      </button>

      <div id="oracle-answer"></div>
    </div>

  </div>

  <script src="scripts/script-tarot-gpt.js"></script>
  <script src="scripts/script.js"></script>
</body>
</html>
