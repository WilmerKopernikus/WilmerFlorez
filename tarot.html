<body>
  <div id="loadingScreen" style="
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            z-index: 3000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            font-family: Arial, Helvetica, sans-serif;
            color: #fff;
            font-size: 20px;
        ">
    <img src="imagenes/videos/cubo.gif" alt="Loading..." style="width: 250px; height: auto; margin-bottom: 20px;">
    <img src="imagenes/loading.webp" style="width: 250px; height: auto; margin-bottom: 20px;">
  </div>
  <div id="sketch-container"></div>
  <div class="container">
    <site-shell></site-shell>

    <h2 class="title" data-i18n="tarotTitle">TAROT INTERACTIVO</h2>

    <div id="tarot-section">
      <div class="tarot-instructions-box">
        <h3 data-i18n="tarotInstrucciones">Instrucciones:</h3>
        <p class="oraculo-texto" data-i18n="tarotInstrucciones2">
          1. Formula una pregunta <br>
          2. Saca una carta o una triada<br>
          3. Voltea las cartas dandoles click<br>
          4. Presiona el botón consultar al oráculo.

        </p>
      </div>

      <!-- 1. La pregunta, ARRIBA -->
      <textarea id="tarot-question" rows="3" data-i18n="placeholder"
        placeholder="Escribe aquí tu pregunta al oráculo..."></textarea>

      <!-- 2. Los dos botones de tirada -->
      <div class="tarot-draw-buttons">
        <button class="tarot-button" id="una-carta" data-i18n="eineKarte">
          Saca una Carta
        </button>
        <button class="tarot-button" id="triada" data-i18n="eineTriade">
          Saca una triada
        </button>
      </div>

      <!-- 3. Resultado de las cartas -->
      <div id="resultado"></div>

      <!-- 4. Botón de preguntar al oráculo, ABAJO -->
      <button class="tarot-button" id="ask-oracle-btn" data-i18n="preguntarOraculo">
        Preguntar al oráculo
      </button>

      <!-- 5. Respuesta del oráculo -->
      <div id="oracle-answer"></div>
    </div>


    <script src="scripts/script-tarot-gpt.min.js"></script>
    <script src="scripts/script.min.js"></script>
</body>

</html>
