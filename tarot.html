<!DOCTYPE html>
<html lang="de">

<head>


  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Tarot Interactivo con IA - Proyecto de Wilmer Florez">
  <meta name="theme-color" content="#581845">
  <link rel="manifest" href="/manifest.json">

  <title>Wilmer Florez - Web Developer</title>
  <script defer src="scripts/p5.min.js"></script>
  <script defer src="sketch.js"></script>
  <link rel="prefetch" as="image" href="tarot_caravaggio/reverso.png">
  <link rel="stylesheet" href="styles/style-tarot.css">

  <link rel="stylesheet" href="styles/cards_intro.min.css">
  <link rel="stylesheet" href="styles/header_test.min.css">
  <link rel="stylesheet" href="styles/cards.min.css">
  <link rel="stylesheet" href="styles/images.min.css">
  <link rel="stylesheet" href="styles/global-text.min.css">

  <link rel="stylesheet" href="styles/languages_content.min.css">
  <script src="scripts/languages_content.min.js" defer></script>
  <script src="scripts/sw-register.js" defer></script>

</head>

<body>
  <div id="loadingScreen" style="
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            z-index: 3000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            font-family: Arial, Helvetica, sans-serif;
            color: #fff;
            font-size: 20px;
        ">
    <img src="imagenes/videos/cubo.gif" alt="Loading..." style="width: 250px; height: auto; margin-bottom: 20px;">
    <img src="imagenes/loading.webp" style="width: 250px; height: auto; margin-bottom: 20px;">
  </div>
  <div id="sketch-container"></div>
  <div class="container">
    <div class="header">
      <div class="nav-container">
        <a href="index.html">
          <img src="imagenes/Logo.png" alt="Kopernikus Design Logo" class="header-logo">
        </a>
      </div>
    </div>

    <div class="hamburger-menu">
      <div class="hamburger" id="hamburger">
        <span></span><span></span><span></span>
      </div>
    </div>

    <div class="language-selector">
      <input type="checkbox" id="langToggle" hidden />
      <label for="langToggle" class="current-lang">DE ▼</label>
      <ul class="language-options">
        <li><button class="lang-button" data-lang="de">DE</button></li>
        <li><button class="lang-button" data-lang="en">EN</button></li>
        <li><button class="lang-button" data-lang="es">ES</button></li>
      </ul>
    </div>

    <div class="menu-overlay" id="menuOverlay">
      <ul>
        <li>
          <a href="index.html">
            <img class="menu-icon" src="imagenes/svg/cubo.svg" alt="Startseite Icon">
            <span data-i18n="menuIndex">Startseite</span>
          </a>
        </li>

        <li>
          <a href="projekte.html">
            <img class="menu-icon" src="imagenes/svg/cases.svg" alt="Projekte Icon">
            <span data-i18n="menuProjekte">Projekte</span>
          </a>
        </li>

        <li>
          <a href="docs/Lebenslauf.pdf" target="_blank">
            <img class="menu-icon" src="imagenes/svg/lebenslauf.svg" alt="Lebenslauf Icon">
            <span data-i18n="menuCV">Lebenslauf</span>
          </a>
        </li>


        <li>
          <a href="kontakt.html">
            <img class="menu-icon" src="imagenes/svg/contact.svg" alt="Kontakt Icon">
            <span data-i18n="menuKontakt">Kontakt</span>
          </a>
        </li>
      </ul>
    </div>

    <h2 class="title" data-i18n="tarotTitle">TAROT INTERACTIVO</h2>

    <div id="tarot-section">
      <div class="tarot-instructions-box">
        <h3 data-i18n="tarotInstrucciones">Instrucciones:</h3>
        <p class="oraculo-texto" data-i18n="tarotInstrucciones2">
          1. Formula una pregunta <br>
          2. Saca una carta o una triada<br>
          3. Voltea las cartas dandoles click<br>
          4. Presiona el botón consultar al oráculo.

        </p>
      </div>

      <!-- 1. La pregunta, ARRIBA -->
      <textarea id="tarot-question" rows="3" data-i18n="placeholder"
        placeholder="Escribe aquí tu pregunta al oráculo..."></textarea>

      <!-- 2. Los dos botones de tirada -->
      <div class="tarot-draw-buttons">
        <button class="tarot-button" id="una-carta" data-i18n="eineKarte">
          Saca una Carta
        </button>
        <button class="tarot-button" id="triada" data-i18n="eineTriade">
          Saca una triada
        </button>
      </div>

      <!-- 3. Resultado de las cartas -->
      <div id="resultado"></div>

      <!-- 4. Botón de preguntar al oráculo, ABAJO -->
      <button class="tarot-button" id="ask-oracle-btn" data-i18n="preguntarOraculo">
        Preguntar al oráculo
      </button>

      <!-- 5. Respuesta del oráculo -->
      <div id="oracle-answer"></div>
    </div>


    <script src="scripts/script-tarot-gpt.js"></script>
    <script src="scripts/script.min.js"></script>
</body>

</html>
